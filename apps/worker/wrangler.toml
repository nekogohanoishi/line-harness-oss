name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# ═══════════════════════════════════════════════════════════════
# デフォルト = テスト環境 (noda@)
# 使い方: npx wrangler deploy
# ═══════════════════════════════════════════════════════════════
account_id = "YOUR_DEV_ACCOUNT_ID"

# 静的アセット。LIFF ページ (dist/client/*) に加えて、管理画面の
# Next.js static export を dist/client/admin/ へ同期して同一オリジン配信する
# (apps/worker/scripts/sync-admin-assets.mjs)。
# html_handling = "auto-trailing-slash" により /admin/events/bookings が
# admin/events/bookings.html へ解決されるので、SPA のディープリンクが 200 で返る。
# not_found_handling = "none" は「アセットに無いパスは Worker へ渡す」既定動作。
[assets]
directory = "dist/client"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "line-harness"
database_id = "YOUR_DEV_D1_DATABASE_ID"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

# ADMIN_ORIGIN は「管理画面のベースURL」。同一オリジン配信では Worker 自身の
# URL + /admin を指す。CORS 判定では origin 部分だけを見るので、パスは
# LINE 通知内のディープリンク生成にのみ効く。
# 同一オリジンなので ADMIN_ALLOW_CROSS_SITE = "false" → Cookie は SameSite=Lax。
# これで iOS Safari 等のサードパーティ Cookie ブロックの影響を受けない。
[vars]
WORKER_URL = "https://line-harness.nekogohanoishi.workers.dev"
ADMIN_ORIGIN = "https://line-harness.nekogohanoishi.workers.dev/admin"
ADMIN_ALLOW_CROSS_SITE = "false"

# ═══════════════════════════════════════════════════════════════
# 本番環境 (aiagent.mini@)
# 使い方: npx wrangler deploy --env production --name your-worker-name
# D1:     npx wrangler d1 execute line-crm --env production --remote --file ...
# ═══════════════════════════════════════════════════════════════
[env.production]
account_id = "YOUR_ACCOUNT_ID"

[env.production.assets]
directory = "dist/client"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[env.production.d1_databases]]
binding = "DB"
database_name = "line-crm"
database_id = "YOUR_D1_DATABASE_ID"

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[env.production.triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

[env.production.vars]
WORKER_URL = "https://line-harness.nekogohanoishi.workers.dev"
ADMIN_ORIGIN = "https://line-harness.nekogohanoishi.workers.dev/admin"
ADMIN_ALLOW_CROSS_SITE = "false"
